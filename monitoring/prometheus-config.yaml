apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sms-ns
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "student-mark-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["sms-service.sms-ns.svc.cluster.local:8000"]
