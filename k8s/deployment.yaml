apiVersion: apps/v1
kind: Deployment

metadata:
  name: sms-deployment
  namespace: sms-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-service

  template:
    metadata:
      labels:
        app: student-service

    spec:
      containers:
        - name: sms-container
          image: studentmarkservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000